name: solver checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[test]"
      - run: python -m unittest test.test_geqdsk test.test_desc_export test.test_ballooning
      - run: |
          python -m test.test_fem
          python -m test.test_mesh
          python -m test.test_assembly
          python -m test.test_profiles
          python -m test.test_post
          python -m test.test_post_global
          python -m test.test_solver
      - run: python scripts/validate_bean_catalog.py data/bean --require-freeqdsk
      - name: Run the bean examples shipped in the clone
        run: |
          python try_bean_gs.py --output results/bean_smoke
          python inspect_bean_data.py --output results/catalog_smoke
